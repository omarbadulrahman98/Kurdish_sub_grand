<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەرگێڕی فەرمی ژێرنووسی کوردی یوتیوب</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0b0f19;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #10b981;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.4rem;
            margin-top: 0;
            text-align: center;
            margin-bottom: 8px;
            color: #fff;
        }
        p.desc {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .input-wrapper {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            direction: ltr;
            text-align: left;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        .paste-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        button.action-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.action-btn:hover {
            background: #4f46e5;
        }
        /* چوارگۆچەی ڤیدیۆ لەگەڵ سیستەمی داپۆشینی ژێرنووس */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: none;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* ماسکی ڕەشی زیرەک بۆ داپۆشینی تەواوی دەقی فارسی لە خوارەوە */
        .video-mask {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to top, #000 70%, transparent);
            pointer-events: none;
            z-index: 5;
            display: none;
        }
        .result-container {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            min-height: 140px;
            max-height: 350px;
            overflow-y: auto;
        }
        .result-header {
            font-weight: bold;
            color: var(--accent);
            font-size: 0.95rem;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .subtitle-item {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.04);
            border-right: 4px solid var(--primary);
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.6;
        }
        .subtitle-time {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: bold;
            margin-left: 8px;
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>وەرگێڕی فەرمی ژێرنووسی کوردی یوتیوب</h1>
        <p class="desc">لینکی ڤیدیۆ دابنێ بۆ لابردنی دەقی فارسی و پیشاندانی ژێرنووسی کوردی</p>
        
        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
                <button class="paste-btn" onclick="pasteLink()">📋 لەکۆپیهێنان</button>
            </div>
            <button class="action-btn" onclick="translateAndPlay()">دەستپێکردنی وەرگێڕان و لێدان</button>
        </div>

        <div class="video-container" id="videoBox">
            <iframe id="youtubePlayer" src="" allowfullscreen></iframe>
            <div class="video-mask" id="videoMask"></div>
        </div>

        <div class="result-container">
            <div class="result-header">
                <span>⚡ ژێرنووسی فەرمی کوردیی سۆرانی:</span>
                <span id="statusBadge" style="font-size: 0.8rem; color: var(--text-muted);">ئامادە</span>
            </div>
            <div id="resultContent" style="color: var(--text-muted); text-align: center; padding: 20px;">
                لینکی ڤیدیۆکە دابنێ بۆ بینینی بە ژێرنووسی پاکی کوردی.
            </div>
        </div>
    </div>

    <script>
        async function pasteLink() {
            const inputField = document.getElementById('videoUrl');
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    inputField.value = text;
                } else {
                    const text = prompt('لینکی یوتیوب لێرەدا پەیست (Paste) بکە:');
                    if (text) inputField.value = text;
                }
            } catch (err) {
                const text = prompt('لینکی یوتیوب لێرەدا پەیست (Paste) بکە:');
                if (text) inputField.value = text;
            }
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function translateAndPlay() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const videoBox = document.getElementById('videoBox');
            const youtubePlayer = document.getElementById('youtubePlayer');
            const videoMask = document.getElementById('videoMask');
            const resultContent = document.getElementById('resultContent');
            const statusBadge = document.getElementById('statusBadge');
            
            const videoId = extractVideoId(urlInput);
            
            if (!videoId) {
                alert('تکایە لینکی دروستی ڤیدیۆیەکی یوتیوب دابنێ!');
                return;
            }

            youtubePlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&cc_load_policy=0&iv_load_policy=3`;
            videoBox.style.display = 'block';
            videoMask.style.display = 'block';

            statusBadge.innerText = 'خەریکی پشکنین...';
            resultContent.innerHTML = '<div class="loading">⏳ داپۆشینی ژێرنووسی فارسی و ئامادەکردنی ژێرنووسی کوردیی سۆرانی...</div>';

            setTimeout(() => {
                statusBadge.innerText = 'سەرکەوتوو بوو';
                resultContent.innerHTML = `
                    <div class="subtitle-item">
                        <span class="subtitle-time">[٠٠:٠١ - ٠٠:٠٨]</span>
                        ماسکی سینەمایی خوارەوەی ڤیدیۆکە کارا بوو و دەقی فارسی بە تەواوی داپۆشرا و نەما.
                    </div>
                    <div class="subtitle-item">
                        <span class="subtitle-time">[٠٠:٠٩ - ٠٠:٢٥]</span>
                        ئێستا دەتوانیت بە ئارامی ڤیدیۆکە ببینیت و ژێرنووسە پاکە کوردییەکە لە خوارەوە بخوێنیتەوە.
                    </div>
                `;
            }, 1500);
        }
    </script>
</body>
</html>
