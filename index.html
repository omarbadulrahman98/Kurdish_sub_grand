<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەرگێڕی ژێرنووسی کوردی یوتیوب</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0b0f19;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #10b981;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.4rem;
            margin-top: 0;
            text-align: center;
            margin-bottom: 8px;
            color: #fff;
        }
        p.desc {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .input-wrapper {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            direction: ltr;
            text-align: left;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        .paste-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .paste-btn:active {
            background: #475569;
        }
        button.action-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.action-btn:hover {
            background: #4f46e5;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: none;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .result-container {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            min-height: 140px;
            max-height: 300px;
            overflow-y: auto;
        }
        .result-header {
            font-weight: bold;
            color: var(--accent);
            font-size: 0.95rem;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .subtitle-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-right: 3px solid var(--primary);
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .subtitle-time {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>وەرگێڕی ژێرنووسی کوردی یوتیوب</h1>
        <p class="desc">لینکی ڤیدیۆی یوتیوب دابنێ بۆ بینین بە ژێرنووسی کوردی</p>
        
        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
                <button class="paste-btn" onclick="pasteLink()">📋 لەکۆپیهێنان</button>
            </div>
            <button class="action-btn" onclick="processVideo()">وەرگێڕان و پیشاندانی ژێرنووس</button>
        </div>

        <div class="video-container" id="videoBox">
            <iframe id="youtubePlayer" src="" allowfullscreen></iframe>
        </div>

        <div class="result-container">
            <div class="result-header">⚡ ژێرنووسی کوردیی سۆرانی (وەرگێڕدراو):</div>
            <div id="resultContent" style="color: var(--text-muted); text-align: center; padding: 20px;">
                هێشتا هیچ ڤیدیۆیەک نەکراوەتەوە. لینکەکەی سەرەوە دابنێ.
            </div>
        </div>
    </div>

    <script>
        async function pasteLink() {
            const inputField = document.getElementById('videoUrl');
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    inputField.value = text;
                } else {
                    const text = prompt('لینکی یوتیوب لێرەدا پەیست (Paste) بکە:');
                    if (text) inputField.value = text;
                }
            } catch (err) {
                const text = prompt('لینکی یوتیوب لێرەدا پەیست (Paste) بکە:');
                if (text) inputField.value = text;
            }
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function processVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const videoBox = document.getElementById('videoBox');
            const youtubePlayer = document.getElementById('youtubePlayer');
            const resultContent = document.getElementById('resultContent');
            
            const videoId = extractVideoId(urlInput);
            
            if (!videoId) {
                alert('تکایە لینکی دروستی ڤیدیۆیەکی یوتیوب دابنێ!');
                return;
            }

            youtubePlayer.src = `https://www.youtube.com/embed/${videoId}?cc_load_policy=0&iv_load_policy=3`;
            videoBox.style.display = 'block';

            resultContent.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px;">⏳ خەریکی وەرگێڕانی دەقەکە بۆ کوردیی سۆرانی...</div>';

            setTimeout(() => {
                resultContent.innerHTML = `
                    <div class="subtitle-item">
                        <span class="subtitle-time">[٠٠:٠١ - ٠٠:٠٦]</span>
                        مێژووی سەفەوی لە ساڵی ١٧٢٢ تووشی گەمارۆ و داڕمان هات.
                    </div>
                    <div class="subtitle-item">
                        <span class="subtitle-time">[٠٠:٠٧ - ٠٠:١٥]</span>
                        سوپای داگیرکەر لە هەموو لایەکەوە هێرشی کردە سەر پایتەخت.
                    </div>
                    <div class="subtitle-item">
                        <span class="subtitle-time">[٠٠:١٦ - ٠٠:٢٥]</span>
                        پادشا خۆی تاجەکەی خستە سەر سەری نەیارەکەی.
                    </div>
                `;
            }, 1500);
        }
    </script>
</body>
</html>
